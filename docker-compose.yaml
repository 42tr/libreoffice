services:
  libreoffice:
    image: ghcr.io/42tr/libreoffice:0.0.4
    restart: unless-stopped
    init: true
    ports:
      - "${LIBREOFFICE_PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
      LIBREOFFICE_MAX_CONCURRENCY: "${LIBREOFFICE_MAX_CONCURRENCY:-4}"
      LIBREOFFICE_QUEUE_TIMEOUT: "${LIBREOFFICE_QUEUE_TIMEOUT:-60}"
      LIBREOFFICE_CLI_TIMEOUT: "${LIBREOFFICE_CLI_TIMEOUT:-180}"
      LIBREOFFICE_TASK_TIMEOUT: "${LIBREOFFICE_TASK_TIMEOUT:-300}"
      LIBREOFFICE_MAX_UPLOAD_MB: "${LIBREOFFICE_MAX_UPLOAD_MB:-100}"
    # Longer than queue timeout + task timeout so in-flight conversions can finish.
    stop_grace_period: 7m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
