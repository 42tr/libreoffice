services:
  libreoffice:
    image: ghcr.io/42tr/libreoffice:0.0.3
    restart: unless-stopped
    init: true
    ports:
      - "${LIBREOFFICE_PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
      LIBREOFFICE_MAX_CONCURRENCY: "${LIBREOFFICE_MAX_CONCURRENCY:-4}"
      LIBREOFFICE_QUEUE_TIMEOUT: "${LIBREOFFICE_QUEUE_TIMEOUT:-60}"
      LIBREOFFICE_CLI_TIMEOUT: "${LIBREOFFICE_CLI_TIMEOUT:-180}"
    stop_grace_period: 4m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
